name: audit
# Manual speed + SEO audit: builds the site from the saved state (no feed download, NO deploy), serves it with the real
# _headers rules and runs Lighthouse (mobile + desktop) on key pages plus the SEO lint. Everything runs on the GitHub runner.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HRK_ENV: production
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Restore state (encrypted)
        run: scripts/state.sh pull
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
      - name: Blog feature photos (Pexels CDN)
        run: python3 scripts/blog_photos.py
      - name: Build site
        timeout-minutes: 30
        run: python3 scripts/build.py
      - name: SEO lint
        continue-on-error: true
        run: mkdir -p /tmp/audit && python3 scripts/seo_lint.py dist /tmp/audit/seo-report.json
      - name: Pages check with real headers (CSP violations, horizontal scroll)
        continue-on-error: true
        run: |
          npm i --no-save --silent puppeteer-core@23.11.1 >/dev/null
          (node scripts/serve.mjs 8765 >/dev/null 2>&1 &)
          sleep 2
          CHROME_PATH=$(command -v google-chrome || command -v chromium) node scripts/check_pages.mjs http://localhost:8765 /tmp/audit/shots | tee /tmp/audit/pages-check.txt
          pkill -f "scripts/serve.mjs" || true
      - name: Lighthouse (mobile + desktop)
        continue-on-error: true
        run: |
          (node scripts/serve.mjs 8765 >/dev/null 2>&1 &)
          sleep 2
          PROD=$(grep -o '<loc>[^<]*' dist/sitemap-products-1.xml | sed 's/<loc>https:\/\/hrackarium.cz//' | sed -n '1p;40p')
          flags="--headless=new --no-sandbox --disable-gpu"
          # warm-up (the first Lighthouse run after npx install is slow and sometimes fails with NO_NAVSTART): result thrown away
          npx --yes lighthouse@12.8.2 "http://localhost:8765/darky/" --quiet --output=json --output-path=/tmp/audit/warmup.json --chrome-flags="$flags" --only-categories=seo || true
          for u in / /lego/ /spolecenske-hry/ /darky/ $PROD; do
            n=$(echo "$u" | tr -c 'a-z0-9' '_' | cut -c1-40)
            for mode in mobile desktop; do
              extra=""; [ "$mode" = desktop ] && extra="--preset=desktop"
              for try in 1 2 3; do
                npx --yes lighthouse@12.8.2 "http://localhost:8765$u" $extra --quiet --output=json --output-path="/tmp/audit/lh-$mode-$n.json" \
                  --chrome-flags="$flags" --only-categories=performance,accessibility,best-practices,seo || true
                python3 -c "import json,sys;d=json.load(open('/tmp/audit/lh-$mode-$n.json'));sys.exit(0 if d['categories']['performance']['score'] is not None else 1)" && break
                echo "lighthouse $mode $u failed (try $try), repeating"
              done
            done
          done
